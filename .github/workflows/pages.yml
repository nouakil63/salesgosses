# Publication automatique du site sur GitHub Pages.
# Chaque push sur main met le site en ligne.
# À activer une fois : Settings > Pages > Source = GitHub Actions
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      # Site statique : aucun build, on envoie la racine telle quelle.
      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publier
        id: publication
        uses: actions/deploy-pages@v4
